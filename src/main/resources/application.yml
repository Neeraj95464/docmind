spring:
  application:
    name: docmind
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

docmind:
  data-dir: ${DOCMIND_DATA_DIR:./data}
  chunking:
    size: 800        # characters per chunk (~200 tokens)
    overlap: 150     # characters carried over between neighbouring chunks
  retrieval:
    default-top-k: 4 # passages sent to the model per question
    max-top-k: 8     # hard cap regardless of what the client asks for
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}          # blank -> retrieval-only mode
    model: ${DOCMIND_MODEL:claude-sonnet-5-5}
    max-tokens: 2048
    effort: low
    timeout: 30s
    max-retries: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
